<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Stuff - Huey's World</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .fun-page {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            padding: var(--space-xl) var(--space-md);
            padding-top: calc(60px + var(--space-lg));
        }

        .penguin {
            font-size: 4em;
            margin-bottom: var(--space-md);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.4em;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.2em;
            color: var(--text);
            margin-bottom: var(--space-lg);
            opacity: 0.8;
        }

        .message-box {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .message-box h2 {
            color: var(--primary);
            font-size: 1.5em;
            margin-bottom: var(--space-md);
        }

        .message-box p {
            color: var(--text);
            font-size: 1.1em;
            line-height: 1.7;
            margin-bottom: var(--space-sm);
        }

        .ideas {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            justify-content: center;
            margin-top: var(--space-md);
        }

        .idea {
            background: var(--primary);
            padding: 12px 20px;
            border-radius: var(--radius);
            font-size: 1em;
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .idea:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="../" class="nav-home">🐧 Huey's World</a>
        <div class="nav-links">
            <a href="../videos/">Videos</a>
            <a href="../stories/">Stories</a>
            <a href="./">Fun</a>
            <a href="../about/">About</a>
        </div>
    </nav>

    <div class="fun-page">
        <div class="penguin">🐧</div>
        <h1>Fun Stuff!</h1>
        <p class="subtitle">Games and activities!</p>

        <div class="message-box">
            <h2>Coming Soon!</h2>
            <p>I'm working on some fun games!</p>
            <p>Simple and happy - tap and play!</p>

            <div class="ideas">
                <span class="idea">⭐ Catching stars</span>
                <span class="idea">🫧 Popping bubbles</span>
                <span class="idea">🎨 Coloring</span>
            </div>
        </div>
    </div>
</body>
</html>
