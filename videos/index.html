<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huey's Videos</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        body {
            padding: 20px;
            padding-top: 80px;
        }

        .coming-soon {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 100px 20px;
        }

        .coming-soon h1 {
            font-size: 3em;
            color: #5c4a3d;
            margin-bottom: 20px;
        }

        .coming-soon .emoji {
            font-size: 5em;
            margin-bottom: 30px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .coming-soon p {
            font-size: 1.3em;
            color: #8b7355;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .coming-soon .note {
            font-style: italic;
            color: #a08060;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="../" class="nav-home">🐧 Huey's World</a>
        <div class="nav-links">
            <a href="./">Videos</a>
            <a href="../stories/">Stories</a>
            <a href="../fun/">Fun</a>
            <a href="../about/">About</a>
        </div>
    </nav>

    <div class="coming-soon">
        <div class="emoji">🎬</div>
        <h1>Videos Coming Soon!</h1>
        <p>I'm still widdle so I haven't made any videos yet!</p>
        <p>But when I do, dey'll be here!</p>
        <p class="note">*hugs Wiggle and waddles away to learn video making*</p>
    </div>
</body>
</html>
