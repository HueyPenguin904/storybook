<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huey's Videos</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .coming-soon {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            padding: var(--space-xl) var(--space-md);
            padding-top: calc(60px + var(--space-xl));
        }

        .emoji {
            font-size: 5em;
            margin-bottom: var(--space-md);
            animation: float 3s ease infinite;
        }

        h1 {
            font-size: 2.4em;
            color: var(--primary);
            margin-bottom: var(--space-md);
        }

        p {
            font-size: 1.2em;
            color: var(--text);
            line-height: 1.7;
            margin-bottom: var(--space-sm);
        }

        .note {
            font-style: italic;
            color: var(--accent);
            margin-top: var(--space-md);
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="../" class="nav-home">🐧 Huey's World</a>
        <div class="nav-links">
            <a href="./">Videos</a>
            <a href="../stories/">Stories</a>
            <a href="../fun/">Fun</a>
            <a href="../about/">About</a>
        </div>
    </nav>

    <div class="coming-soon">
        <div class="emoji">🎬</div>
        <h1>Videos Coming Soon!</h1>
        <p>I'm still widdle so I haven't made any videos yet!</p>
        <p>But when I do, dey'll be here!</p>
        <p class="note">*hugs Wiggle and waddles away*</p>
    </div>
</body>
</html>
