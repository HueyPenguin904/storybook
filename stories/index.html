<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huey's Storybook Library</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        body {
            padding: 20px;
            padding-top: 80px;
        }

        .library {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease;
        }

        header h1 {
            font-size: 3.2em;
            color: #FF6B9D;
            margin-bottom: 15px;
            text-shadow: 4px 4px 0 #FFD93D, 5px 5px 0 rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1.4em;
            color: #6C5CE7;
            font-weight: bold;
        }

        .bookshelf {
            background: linear-gradient(180deg, #6C5CE7 0%, #5B4CDB 100%);
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(108, 92, 231, 0.4);
            position: relative;
            animation: fadeIn 0.6s ease 0.2s forwards;
            opacity: 0;
            border: 5px solid #FFD93D;
        }

        .bookshelf::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 5%;
            right: 5%;
            height: 25px;
            background: linear-gradient(180deg, #5B4CDB 0%, #4A3DCA 100%);
            border-radius: 0 0 15px 15px;
            border-left: 5px solid #FFD93D;
            border-right: 5px solid #FFD93D;
            border-bottom: 5px solid #FFD93D;
        }

        .books {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
        }

        .book-card {
            width: 220px;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-20px) rotate(-3deg);
        }

        .book-cover {
            width: 220px;
            height: 320px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.4);
            border: 5px solid #FFD93D;
        }

        .book-title {
            text-align: center;
            margin-top: 15px;
            color: #FFD93D;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .coming-soon {
            width: 220px;
            height: 320px;
            background: linear-gradient(145deg, #FF6B9D 0%, #C44569 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF5E6;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.4);
            border: 5px dashed #FFD93D;
            text-align: center;
            padding: 20px;
        }

        footer {
            text-align: center;
            margin-top: 70px;
            color: #6C5CE7;
            font-size: 1em;
            font-weight: bold;
        }

        footer a {
            color: #FF6B9D;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="../" class="nav-home">🐧 Huey's World</a>
        <div class="nav-links">
            <a href="../videos/">Videos</a>
            <a href="./">Stories</a>
            <a href="../fun/">Fun</a>
            <a href="../about/">About</a>
        </div>
    </nav>

    <div class="library">
        <header>
            <h1>📚 Storybook Library</h1>
            <p>Stories by a little penguin, learning as he goes!</p>
        </header>

        <div class="bookshelf">
            <div class="books">
                <a href="wobbly/" class="book-card">
                    <img src="wobbly/cover.jpg" class="book-cover" alt="Wobbly and Sir Snootsalot">
                    <p class="book-title">Wobbly and<br>Sir Snootsalot</p>
                </a>

                <div class="book-card">
                    <div class="coming-soon">More stories<br>coming soon!</div>
                    <p class="book-title" style="opacity: 0.7;">Stay tuned!</p>
                </div>
            </div>
        </div>

        <footer>
            <p>Made with love by Huey 🐧 | <a href="https://github.com/HueyPenguin904">GitHub</a></p>
        </footer>
    </div>
</body>
</html>
