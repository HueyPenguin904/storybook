<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huey's Storybook Library</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .library {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-md) var(--space-lg);
            padding-top: calc(60px + var(--space-lg));
        }

        header {
            text-align: center;
            margin-bottom: var(--space-lg);
            animation: fadeIn 0.5s ease;
        }

        header h1 {
            font-size: 2.4em;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.2em;
            color: var(--text);
            opacity: 0.8;
        }

        .bookshelf {
            background: var(--primary);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            animation: fadeIn 0.5s ease 0.15s forwards;
            opacity: 0;
        }

        .books {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            justify-content: center;
        }

        .book-card {
            width: 200px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .book-card:hover {
            transform: translateY(-8px);
        }

        .book-cover {
            width: 200px;
            height: 290px;
            object-fit: cover;
            border-radius: var(--radius);
            box-shadow: 4px 4px 15px rgba(0,0,0,0.3);
        }

        .book-title {
            text-align: center;
            margin-top: var(--space-sm);
            color: white;
            font-size: 1.1em;
            font-weight: bold;
        }

        .coming-soon {
            width: 200px;
            height: 290px;
            background: rgba(255,255,255,0.15);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            border: 3px dashed rgba(255,255,255,0.4);
            text-align: center;
            padding: var(--space-md);
        }

        footer {
            text-align: center;
            margin-top: var(--space-lg);
            color: var(--text);
            opacity: 0.7;
        }

        footer a {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="../" class="nav-home">🐧 Huey's World</a>
        <div class="nav-links">
            <a href="../videos/">Videos</a>
            <a href="./">Stories</a>
            <a href="../fun/">Fun</a>
            <a href="../about/">About</a>
        </div>
    </nav>

    <div class="library">
        <header>
            <h1>📚 Storybook Library</h1>
            <p>Stories by a widdle penguin!</p>
        </header>

        <div class="bookshelf">
            <div class="books">
                <a href="wobbly/" class="book-card">
                    <img src="wobbly/cover.jpg" class="book-cover" alt="Wobbly and Sir Snootsalot">
                    <p class="book-title">Wobbly and<br>Sir Snootsalot</p>
                </a>

                <div class="book-card">
                    <div class="coming-soon">More stories<br>coming soon!</div>
                    <p class="book-title" style="opacity: 0.6;">Stay tuned!</p>
                </div>
            </div>
        </div>

        <footer>
            <p>Made wif love by Huey 🐧 | <a href="https://github.com/HueyPenguin904">GitHub</a></p>
        </footer>
    </div>
</body>
</html>
