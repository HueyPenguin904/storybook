<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huey's World</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            padding: 20px;
            padding-top: 80px;
        }

        .home-page {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease;
        }

        .penguin-hero {
            font-size: 6em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(4px 4px 0 #FFD93D);
        }

        header h1 {
            font-size: 3.2em;
            color: #FF6B9D;
            margin-bottom: 15px;
            text-shadow: 4px 4px 0 #FFD93D, 5px 5px 0 rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1.4em;
            color: #6C5CE7;
            font-weight: bold;
        }

        .big-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            animation: fadeIn 0.6s ease 0.2s forwards;
            opacity: 0;
        }

        .big-btn {
            aspect-ratio: 1;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 5px solid #FFD93D;
        }

        .big-btn:hover {
            transform: translateY(-10px) rotate(-3deg);
            box-shadow: 0 20px 45px rgba(0,0,0,0.3);
        }

        .big-btn:active {
            transform: scale(0.95);
        }

        .big-btn .icon {
            font-size: 4em;
            margin-bottom: 15px;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.2));
        }

        .big-btn .label {
            font-size: 1.6em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .btn-stories {
            background: linear-gradient(145deg, #FF6B9D 0%, #C44569 100%);
        }

        .btn-videos {
            background: linear-gradient(145deg, #6C5CE7 0%, #5B4CDB 100%);
        }

        .btn-about {
            background: linear-gradient(145deg, #00D9FF 0%, #00B4D8 100%);
        }

        .btn-fun {
            background: linear-gradient(145deg, #2ECC71 0%, #27AE60 100%);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #6C5CE7;
            font-size: 1.1em;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .big-buttons {
                gap: 15px;
            }
            .big-btn .icon {
                font-size: 2.8em;
            }
            .big-btn .label {
                font-size: 1.2em;
            }
            header h1 {
                font-size: 2.2em;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="./" class="nav-home">🐧 Huey's World</a>
        <div class="nav-links">
            <a href="videos/">Videos</a>
            <a href="stories/">Stories</a>
            <a href="fun/">Fun</a>
            <a href="about/">About</a>
        </div>
    </nav>

    <div class="home-page">
        <header>
            <div class="penguin-hero">🐧</div>
            <h1>Huey's World!</h1>
            <p>Stories, adventures, and wiggly fun!</p>
        </header>

        <div class="big-buttons">
            <a href="stories/" class="big-btn btn-stories">
                <span class="icon">📚</span>
                <span class="label">Stories</span>
            </a>

            <a href="videos/" class="big-btn btn-videos">
                <span class="icon">🎬</span>
                <span class="label">Videos</span>
            </a>

            <a href="about/" class="big-btn btn-about">
                <span class="icon">🐧</span>
                <span class="label">About Me</span>
            </a>

            <a href="fun/" class="big-btn btn-fun">
                <span class="icon">🎮</span>
                <span class="label">Fun</span>
            </a>
        </div>

        <footer>
            Made wif 💙 by Huey
        </footer>
    </div>
</body>
</html>
