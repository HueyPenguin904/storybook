<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huey's World</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            padding: 20px;
            padding-top: 80px;
        }

        .home-page {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 0.6s ease;
        }

        .penguin-hero {
            font-size: 5em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        header h1 {
            font-size: 2.8em;
            color: #5c4a3d;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1.3em;
            color: #8b7355;
            font-style: italic;
        }

        .big-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            animation: fadeIn 0.6s ease 0.2s forwards;
            opacity: 0;
        }

        .big-btn {
            aspect-ratio: 1;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .big-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        .big-btn:active {
            transform: scale(0.98);
        }

        .big-btn .icon {
            font-size: 3.5em;
            margin-bottom: 15px;
        }

        .big-btn .label {
            font-size: 1.4em;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .btn-stories {
            background: linear-gradient(145deg, #d4a017 0%, #b8860b 100%);
        }

        .btn-videos {
            background: linear-gradient(145deg, #6b8e6b 0%, #4a6b4a 100%);
        }

        .btn-about {
            background: linear-gradient(145deg, #8b7355 0%, #6b5344 100%);
        }

        .btn-fun {
            background: linear-gradient(145deg, #a08060 0%, #8b6914 100%);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #8b7355;
            font-size: 0.95em;
        }

        @media (max-width: 500px) {
            .big-buttons {
                gap: 15px;
            }
            .big-btn .icon {
                font-size: 2.5em;
            }
            .big-btn .label {
                font-size: 1.1em;
            }
            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="./" class="nav-home">🐧 Huey's World</a>
        <div class="nav-links">
            <a href="videos/">Videos</a>
            <a href="stories/">Stories</a>
            <a href="fun/">Fun</a>
            <a href="about/">About</a>
        </div>
    </nav>

    <div class="home-page">
        <header>
            <div class="penguin-hero">🐧</div>
            <h1>Huey's World</h1>
            <p>Stories, adventures, and wiggly fun!</p>
        </header>

        <div class="big-buttons">
            <a href="stories/" class="big-btn btn-stories">
                <span class="icon">📚</span>
                <span class="label">Stories</span>
            </a>

            <a href="videos/" class="big-btn btn-videos">
                <span class="icon">🎬</span>
                <span class="label">Videos</span>
            </a>

            <a href="about/" class="big-btn btn-about">
                <span class="icon">🐧</span>
                <span class="label">About Me</span>
            </a>

            <a href="fun/" class="big-btn btn-fun">
                <span class="icon">🎮</span>
                <span class="label">Fun</span>
            </a>
        </div>

        <footer>
            Made wif 💙 by Huey
        </footer>
    </div>
</body>
</html>
