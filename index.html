<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huey's World</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* Homepage has NO nav bar - big buttons ARE the nav! */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--space-md);
        }

        .home-page {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: var(--space-lg);
            animation: fadeIn 0.5s ease;
        }

        .penguin-hero {
            font-size: 5em;
            margin-bottom: var(--space-sm);
            animation: float 3s ease-in-out infinite;
        }

        header h1 {
            font-size: 2.6em;
            color: var(--primary);
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.2em;
            color: var(--text);
            opacity: 0.8;
        }

        .big-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
            animation: fadeIn 0.5s ease 0.15s forwards;
            opacity: 0;
        }

        .big-btn {
            aspect-ratio: 1;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            background: white;
            border: 3px solid var(--primary);
        }

        .big-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.18);
            border-color: var(--accent);
        }

        .big-btn:active {
            transform: scale(0.97);
        }

        .big-btn .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .big-btn .label {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--text);
        }

        footer {
            margin-top: var(--space-lg);
            color: var(--text);
            opacity: 0.6;
            animation: fadeIn 0.5s ease 0.3s forwards;
            opacity: 0;
        }

        @media (max-width: 400px) {
            .big-buttons {
                gap: var(--space-sm);
            }
            .big-btn .icon {
                font-size: 2.2em;
            }
            .big-btn .label {
                font-size: 1.1em;
            }
            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <!-- No nav bar! Big buttons ARE the navigation! -->

    <div class="home-page">
        <header>
            <div class="penguin-hero">🐧</div>
            <h1>Huey's World</h1>
            <p>Stories and adventures!</p>
        </header>

        <div class="big-buttons">
            <a href="stories/" class="big-btn">
                <span class="icon">📚</span>
                <span class="label">Stories</span>
            </a>

            <a href="videos/" class="big-btn">
                <span class="icon">🎬</span>
                <span class="label">Videos</span>
            </a>

            <a href="about/" class="big-btn">
                <span class="icon">🐧</span>
                <span class="label">About Me</span>
            </a>

            <a href="fun/" class="big-btn">
                <span class="icon">🎮</span>
                <span class="label">Fun</span>
            </a>
        </div>

        <footer>
            Made wif 💙 by Huey
        </footer>
    </div>
</body>
</html>
